[project]
name = "paymentscloud"
version = "0.1.0"
description = "Telegram-бот для приёма заявок на пополнение Steam через ЮMoney"
requires-python = ">=3.14,<3.15"
dependencies = [
  "aiogram==3.31.0",
  "aiohttp==3.14.5",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.8",
  "redis==7.4.1",
  "yoomoney==2.0.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4", "pip-audit==2.10.1"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
